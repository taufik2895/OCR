[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ocr-vlm-platform"
version = "0.1.0"
description = "Production-ready OCR pipeline with traditional OCR and VLM fallback"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "python-multipart>=0.0.12,<1.0",
  "pypdf>=5.0,<6.0",
  "pypdfium2>=4.30,<5.0",
  "Pillow>=10.4,<12.0",
  "pytesseract>=0.3.13,<1.0",
  "openpyxl>=3.1,<4.0",
  "jinja2>=3.1,<4.0",
]

[project.optional-dependencies]
paddle = ["paddleocr>=2.9,<4.0", "paddlepaddle>=2.6,<4.0"]
vlm = ["transformers>=4.49,<5.0", "torch>=2.4,<3.0", "qwen-vl-utils>=0.0.8,<1.0"]
dev = ["httpx>=0.27,<1.0", "pytest>=8.3,<9.0", "pytest-cov>=5.0,<7.0", "ruff>=0.7,<1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
